# nullshell.solorak.xyz — reverse proxy in front of the static site served by
# server.js under pm2 on 127.0.0.1:3099 (see ecosystem.config.js).
#
# Install:
#   sudo cp deploy/nginx/nullshell.solorak.xyz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nullshell.solorak.xyz.conf \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d nullshell.solorak.xyz
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx never reads the filesystem here. The app serves index.html, the CSS/JS
# and all 360 frame JPEGs out of dist/, with its own cache headers and gzip.

# --- 1. Every plaintext request is redirected, permanently. ---------------
server {
    listen 80;
    listen [::]:80;
    server_name nullshell.solorak.xyz;

    # Leave the ACME challenge reachable over HTTP or renewals will fail.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://nullshell.solorak.xyz$request_uri;
    }
}

# --- 2. The site. --------------------------------------------------------
server {
    # `http2 on;` is a separate directive only from nginx 1.25.1. On anything
    # older it is an "unknown directive" and the config will not load, so the
    # listen-parameter form is used here — it still works on new nginx too
    # (it only logs a deprecation warning). Check with `nginx -v`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nullshell.solorak.xyz;

    ssl_certificate     /etc/letsencrypt/live/nullshell.solorak.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nullshell.solorak.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # NOTE: helmet in server.js sets the security headers and compression
    # gzips the text responses. Do NOT re-add either here — a duplicated
    # header is a genuine misconfiguration, not a belt-and-braces win.
    gzip off;

    # 360 frame JPEGs per page load. The app already marks them immutable for
    # a year; this only keeps them out of the access log.
    location /frames/ {
        proxy_pass http://127.0.0.1:3099;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
