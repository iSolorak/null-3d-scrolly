# ---------------------------------------------------------------------------
# NULLSHELL — nginx site config
#
# Install:
#   sudo cp deploy/nginx/nullshell.conf /etc/nginx/sites-available/nullshell
#   sudo ln -s /etc/nginx/sites-available/nullshell /etc/nginx/sites-enabled/
#   # point it at the real checkout — run this from inside the checkout:
#   sudo sed -i "s#APP_ROOT#$(pwd)#g" /etc/nginx/sites-available/nullshell
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then TLS:
#   sudo certbot --nginx -d nullshell.solorak.xyz
#   (certbot rewrites this file to add the :443 block and the redirect)
#
# If `root` below is wrong or unreadable by nginx, NOTHING BREAKS: every static
# location falls through to the pm2 process, which serves the same files. You
# lose the off-disk fast path, not the site. Check which one is happening:
#   curl -sI https://nullshell.solorak.xyz/styles.css | grep -i x-served-by
# ---------------------------------------------------------------------------

upstream nullshell_app {
    server 127.0.0.1:3099;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nullshell.solorak.xyz;

    # Absolute path to the BUILD OUTPUT: <checkout>/dist
    # `npm run deploy` regenerates it; dist/frames are hardlinks to frames/,
    # so this costs no extra disk.
    root APP_ROOT/dist;

    access_log /var/log/nginx/nullshell.access.log;
    error_log  /var/log/nginx/nullshell.error.log;

    # the frame sequences are ~35 MB across 360 files — stream them off disk
    # when we can, fall back to node when we can't
    # ^~ so this wins over the regex location below (frames are .jpg too) and
    # keeps the 1-year immutable policy instead of the generic 7-day one
    location ^~ /frames/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Served-By "nginx-disk" always;
        try_files $uri @app;
    }

    # minified + content-hashed by the build (requested as ?v=<hash>)
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2|mp4)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Served-By "nginx-disk" always;
        try_files $uri @app;
    }

    # HTML and everything else: node owns it (correct no-cache headers, /healthz)
    location / {
        proxy_pass http://nullshell_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # fallback target for the static locations above
    location @app {
        add_header X-Served-By "node-fallback" always;
        proxy_pass http://nullshell_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # text compresses well; JPEG frames do not — don't waste CPU on them
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) { deny all; }
}
