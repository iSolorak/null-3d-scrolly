# ---------------------------------------------------------------------------
# NULLSHELL — nginx site config
#
# PURE REVERSE PROXY. nginx never touches the filesystem here: no root, no
# alias, no paths to get wrong and no directory permissions to fight. The pm2
# process on 127.0.0.1:3099 serves everything (HTML, CSS, JS, frames) with the
# right cache headers already.
#
# The ONLY thing to edit is server_name.
#
# Install (from inside the checkout):
#   sudo bash deploy/install-nginx.sh nullshell.solorak.xyz
#
# ...or by hand:
#   sudo cp deploy/nginx/nullshell.conf /etc/nginx/sites-available/nullshell
#   sudo ln -sf /etc/nginx/sites-available/nullshell /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nullshell.solorak.xyz
#
# NOTE: if certbot has already edited the installed file, overwriting it drops
# the :443 block. Re-run certbot afterwards — it is idempotent and will re-add
# TLS to this file.
# ---------------------------------------------------------------------------

upstream nullshell_app {
    server 127.0.0.1:3099;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nullshell.solorak.xyz;

    access_log /var/log/nginx/nullshell.access.log;
    error_log  /var/log/nginx/nullshell.error.log;

    # the frame sequences are the bulk of the payload; don't buffer them to disk
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    client_max_body_size 1m;

    location / {
        proxy_pass http://nullshell_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # node already gzips text responses; don't double-compress
    gzip off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) { deny all; }
}

