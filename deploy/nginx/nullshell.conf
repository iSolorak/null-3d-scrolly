# ---------------------------------------------------------------------------
# NULLSHELL — nginx site config
#
# Install:
#   sudo cp deploy/nginx/nullshell.conf /etc/nginx/sites-available/nullshell
#   sudo ln -s /etc/nginx/sites-available/nullshell /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then TLS:
#   sudo certbot --nginx -d nullshell.example.com
#   (certbot rewrites this file to add the :443 block and the redirect)
#
# Replace nullshell.example.com with your domain, and APP_ROOT with the
# absolute path of the checkout on the VPS (e.g. /var/www/nullshell).
# ---------------------------------------------------------------------------

upstream nullshell_app {
    server 127.0.0.1:3099;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name nullshell.solorak.xyz;

    access_log /var/log/nginx/nullshell.access.log;
    error_log  /var/log/nginx/nullshell.error.log;

    # the frame sequences are ~35 MB across 360 files — let nginx stream them
    # straight off disk instead of round-tripping through node
    location /frames/ {
        alias APP_ROOT/frames/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /styles.css            { alias APP_ROOT/styles.css; expires 7d; }
    location /scroll-cinematic.js   { alias APP_ROOT/scroll-cinematic.js; expires 7d; }

    # everything else (index.html, 404s) goes to the pm2 process
    location / {
        proxy_pass http://nullshell_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # text compresses well; JPEG frames do not — don't waste CPU on them
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) { deny all; }
}
